<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <style>
      .contenedor {
        position: relative;
        width: 240px;
        height: 260px;
        border: 2px solid #ddd;
        padding: 15px;
      }

      .contenido {
        height: 130px;
        background-color: pink;
      }

      .contenedor span {
        position: absolute;
        background-color: brown;
        color: white;
        top: 0;
        right: 0;
      }

      button {
        display: block;
        background-color: blueviolet;
        color: white;
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <span>-20%</span>
      <div class="contenido"> </div>
      <p>Auriculares Nimbus</p>
      <p><h3>49€</h3></p>
      <button>Comprar</button>
    </div>
  </body>
</html>
