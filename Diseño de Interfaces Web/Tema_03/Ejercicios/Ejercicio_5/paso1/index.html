<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tostadero Alba | Café de especialidad</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>

  <body>
    <div class="anuncio">
      Envío gratis en pedidos desde 25 € · <a href="#">Ver condiciones</a>
    </div>

    <header class="cabecera">
      <div class="contenedor">
        <!-- prettier-ignore -->
        <div class="barra">
          <a class="logo" href="#">
            <img src="img/logo.svg" alt="" width="40" height="40" />
            <span class="logo-texto">Tostadero Alba</span>
          </a><!--
        --><nav class="principal" aria-label="Principal">
            <ul class="menu">
              <li><a class="activo" href="#">Café</a></li>
              <li><a href="#">Cafeteras</a></li>
              <li><a href="#">Suscripción</a></li>
              <li><a href="#">Nosotros</a></li>
              <li><a href="#">Contacto</a></li>
            </ul>
          </nav><!--
        --><div class="acciones">
            <a class="carrito" href="#">
              <img
                src="img/carrito.svg"
                alt="Carrito"
                width="26"
                height="26"
              /><span class="contador">3</span>
            </a>
            <a class="btn" href="#">Acceder</a>
          </div>
        </div>
      </div>
    </header>

    <main class="contenido">
      <p class="relleno">
        Aquí irá el contenido de la página (portada, productos, suscripción...).
        Lo construiremos en los siguientes pasos.
      </p>
    </main>
  </body>
</html>
