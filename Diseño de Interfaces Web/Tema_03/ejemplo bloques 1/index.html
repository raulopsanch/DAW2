<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .area {

      .bloque {

      }

      .area {

      }
      .izq {
        text-align: left;
      }
      .cen {
        text-align: center;
      }
      .der {

      }
      .etiqueta {
        background: #a9812e;

      }

    <div class="area">

    <br />
    <br />

    </div>
    <br />
    <br />
    <br />
    <br />

    <div class="fila der"><span class="etiqueta">en línea</span></div>
