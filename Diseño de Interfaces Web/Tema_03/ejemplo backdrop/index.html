<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="miEstilo.css" />
    <title>Document</title>
  </head>
  <body>
    <button id="abrir">Abrir diálogo</button>
    <dialog id="dialogo">
      <p><strong>¿Eliminar el curso?</strong></p>
      <p>Esta acción no se puede deshacer.</p>
      <form method="dialog">
        <button>Cancelar</button>
        <button value="ok">Eliminar</button>
      </form>
    </dialog>
    <script>
      document.querySelector("#abrir").addEventListener("click", () => {
        document.querySelector("#dialogo").showModal();
      });
    </script>
  </body>
</html>
